set timeout=0
set default=0
insmod video
insmod vbe
insmod gfxterm
insmod font
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=1024x768
    set gfxpayload=keep
    terminal_output gfxterm
fi

menuentry "Bare-Metal TinyStories AI OS" {
    multiboot2 /boot/kernel.elf
    module2 /boot/model.bin model
    module2 /boot/samples.bin samples
    module2 /boot/text-model.bin text-model
    module2 /boot/llm-model.bin llm-model
    module2 /boot/tokenizer.bin tokenizer
    boot
}
